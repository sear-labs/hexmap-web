[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexmap-web"
version = "0.3.0"
description = "Interactive 3D (deck.gl + MapLibre) and 2D (SVG) web maps of equal-area hexagons, from Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"   # 3.13.9 is what ran
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hexmap_web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 128
extend-exclude = ["archive", "notebooks", "examples/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
